<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact me through my portfolio">
  <title>My Portfolio | Contact</title>
  <link rel="stylesheet" href="../styles/contact.css">
</head>
<body>
  <header class="site-header">
    <nav class="navbar" aria-label="Main navigation">
      <a class="logo" href="index.html">My Portfolio</a>
      <ul class="nav-list">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="contact-section" id="contact">
      <div class="contact-intro">
        <p class="eyebrow">Get In Touch</p>
        <h1>Let's Work Together</h1>
        <p>
          Have a project idea or want to discuss an opportunity?
          Send me a message using the form.
        </p>

        <div class="contact-details">
          <p><strong>Email:</strong> example@ucp.edu.pk</p>
          <p><strong>Location:</strong> Pakistan</p>
        </div>
      </div>

      <form class="contact-form" action="#" method="post">
        <div class="form-group">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required>
        </div>

        <div class="form-group">
          <label for="subject">Subject</label>
          <input id="subject" name="subject" type="text" required>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" required></textarea>
        </div>

        <button type="submit">Send Message</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 My Portfolio. All rights reserved.</p>
  </footer>
</body>
</html>
